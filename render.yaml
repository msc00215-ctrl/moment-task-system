services:
  - type: web
    name: moment-line-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GAS_WEBHOOK_URL
        sync: false
      - key: GAS_SECRET_TOKEN
        sync: false
      - key: SPREADSHEET_ID
        value: 1Drp8iWZ1n2YZRid3FqLnH1hzj_Ap5LQd46ZqKauucTY
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
